# cicd — isolated image for pdfplumber + tuning rollout
# Pushes to <DOCKER_USER>/anox:dev-pdfplumber so we don't disturb :dev or :prd
# consumers while we validate the new ingestion pipeline.
name: deploy-zalazium-pdfplumber
on:
  push:
    branches:
      - zalazium-pdfplumber
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build container image
        run: docker build -t ${{ secrets.DOCKER_USER }}/anox:dev-pdfplumber .

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USER }}/anox:dev-pdfplumber
